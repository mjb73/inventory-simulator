[package]
name = "inventory-simulator"
version = "1.0.3"
edition = "2021"
description = "104-week inventory cover and replenishment planner"
license = "MIT"
repository = "https://github.com/mjb73/inventory-simulator"
readme = "README.md"
keywords = ["inventory", "planning", "supply-chain", "egui"]
categories = ["gui"]

[[bin]]
name = "inventory-simulator"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "glow",
    "x11",
    "wayland",
] }
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
strip = true
